<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Смена пароля — QA Test Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>QA Test Site</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="profile.html">Личный кабинет</a>
            <a href="change_password.html">Сменить пароль</a>
            <a href="change_password.html">Сменить пароль</a>
            <a href="login.html">Войти</a>
        </nav>
    </header>
    <main>
        <h2>Смена пароля</h2>
        <form id="change-password-form">
            <label>Старый пароль:</label>
            <input type="password" name="old_password" required>

            <label>Новый пароль:</label>
            <input type="password" name="new_password" placeholder="Минимум 8 символов" required>

            <label>Повторите новый пароль:</label>
            <input type="password" name="new_password2" required>

            <button type="submit">Сменить пароль</button>
        </form>
    </main>
    <footer>
        <p>QA Practice Environment</p>
    </footer>
    <script>
    document.getElementById('change-password-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const oldPassword = this.querySelector('input[name="old_password"]').value;
        const newPassword = this.querySelector('input[name="new_password"]').value;
        const newPassword2 = this.querySelector('input[name="new_password2"]').value;

        if (newPassword !== newPassword2) {
            alert('Пароли не совпадают!');
            return;
        }

        const token = localStorage.getItem('token');
        if (!token) {
            alert('Вы не авторизованы');
            window.location.href = 'login.html';
            return;
        }

        try {
            const response = await fetch('/api/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword
                })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Пароль успешно изменён!');
                window.location.href = 'profile.html';
            } else {
                alert('Ошибка: ' + data.message);
            }
        } catch (err) {
            alert('Ошибка сети: ' + err.message);
        }
    });
    </script>
</body>
</html>
