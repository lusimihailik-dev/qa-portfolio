<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет — QA Test Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>QA Test Site</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="profile.html">Личный кабинет</a>
            <a href="change_password.html">Сменить пароль</a>
            <a href="login.html">Войти</a>
            <a href="register.html">Регистрация</a>
        </nav>
    </header>
    <main>
        <h2>Личный кабинет</h2>
        <div id="user-info">
            <p>Загрузка данных...</p>
        </div>
        <p><a href="login.html" id="logout">Выйти</a></p>
    </main>
    <footer>
        <p>QA Practice Environment</p>
    </footer>
    <script>
    document.addEventListener('DOMContentLoaded', async function() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        const response = await fetch('/api/users/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const user = await response.json();
            document.getElementById('user-info').innerHTML = `
                <p><strong>ID:</strong> ${user.id}</p>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Имя:</strong> ${user.name}</p>
            `;
        } else {
            document.getElementById('user-info').innerHTML = '<p>Ошибка загрузки данных</p>';
        }
    });

    document.getElementById('logout').addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.removeItem('token');
        window.location.href = 'login.html';
    });
    </script>
</body>
</html>
